<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Control PC</title>
<style>
:root { color-scheme: dark; --bg:#0f1115; --surface:#181b22; --surface2:#20242d; --border:#2a2f3a; --text:#e8eaf0; --muted:#8a92a5; --accent:#4f9dff; --ok:#3ccf7a; --bad:#ef5350; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,Roboto,sans-serif; padding:20px 16px 32px; user-select:none; }
h1 { font-size:24px; margin:8px 0 2px; }
.sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
.bar { display:flex; justify-content:space-between; align-items:center; margin:18px 0 8px; }
.bar h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0; }
button { font:inherit; color:var(--text); background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:10px 14px; }
button:active { background:var(--border); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.pc { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:10px; }
.pc:active { background:var(--surface2); }
.pc .ic { width:44px; height:44px; border-radius:12px; background:#1d2a3d; display:grid; place-items:center; font-size:22px; flex:none; }
.pc .meta { flex:1; min-width:0; }
.pc .name { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pc .addr { color:var(--muted); font-size:13px; }
.tag { font-size:11px; padding:2px 8px; border-radius:20px; margin-left:6px; vertical-align:2px; }
.tag.on { background:#1b3a29; color:var(--ok); }
.tag.off { background:#2a2f3a; color:var(--muted); }
.x { background:none; border:0; color:var(--muted); font-size:18px; padding:8px; }
.empty, .msg { color:var(--muted); background:var(--surface); border:1px dashed var(--border); border-radius:16px; padding:18px; text-align:center; font-size:14px; }
.msg { border-style:solid; border-color:#4a2b2b; color:#f2a5a3; margin-bottom:12px; }
.manual { display:grid; grid-template-columns:1fr 90px; gap:8px; }
input { font:inherit; font-size:16px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; outline:none; width:100%; user-select:text; }
input:focus { border-color:var(--accent); }
.manual button { grid-column:1 / -1; }
.help { color:var(--muted); font-size:13px; line-height:1.6; margin-top:22px; }
.help b { color:var(--text); }
.spin { display:inline-block; width:14px; height:14px; border:2px solid var(--muted); border-top-color:transparent; border-radius:50%; animation:r .8s linear infinite; vertical-align:-2px; margin-right:6px; }
@keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<h1>Control PC</h1>
<p class="sub">Mouse, teclado y multimedia para tu PC</p>

<div id="msg" class="msg" hidden></div>

<div class="bar"><h2>PCs en tu red</h2><button id="scan">Buscar</button></div>
<div id="list"></div>

<div class="bar"><h2>Conectar por IP</h2></div>
<div class="manual">
  <input id="ip" inputmode="decimal" placeholder="192.168.1.50" autocomplete="off">
  <input id="port" inputmode="numeric" value="8765">
  <button id="go" class="primary">Conectar</button>
</div>

<p class="help">
  1. En el PC abre <b>Iniciar servidor.bat</b>.<br>
  2. Conecta el celular a la <b>misma red Wi-Fi</b>.<br>
  3. Elige tu PC e ingresa el <b>PIN</b> que muestra la pantalla del PC (solo la primera vez).
</p>

<script>
'use strict';
const N = window.AndroidRC;
const $ = (s) => document.querySelector(s);
let saved = { pcs: {}, last: '' };
let found = [];
let scanning = false;

const message = decodeURIComponent(location.hash.slice(1) || '');
if (message) { $('#msg').textContent = message; $('#msg').hidden = false; }

function loadSaved() { try { saved = JSON.parse(N.saved()); } catch (e) { saved = { pcs: {}, last: '' }; } }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function render() {
  const items = new Map();
  for (const [id, pc] of Object.entries(saved.pcs || {})) items.set(id, { id, ...pc, saved: true, online: false });
  for (const f of found) {
    const cur = items.get(f.id) || { id: f.id, saved: false };
    items.set(f.id, { ...cur, name: f.name, host: f.host, port: f.port, online: true });
  }
  const list = [...items.values()].sort((a, b) => (b.online - a.online) || (b.id === saved.last) - (a.id === saved.last));
  if (!list.length) {
    $('#list').innerHTML = `<div class="empty">${scanning ? '<span class="spin"></span>Buscando PCs…' : 'No se encontró ningún PC. Revisa que el servidor esté abierto, o conéctate por IP.'}</div>`;
    return;
  }
  $('#list').innerHTML = list.map((pc) => `
    <div class="pc" data-id="${esc(pc.id)}" data-host="${esc(pc.host)}" data-port="${esc(pc.port)}" data-saved="${pc.saved ? 1 : 0}">
      <div class="ic">🖥️</div>
      <div class="meta">
        <div class="name">${esc(pc.name || 'PC')}${pc.online ? '<span class="tag on">En la red</span>' : '<span class="tag off">No visto</span>'}</div>
        <div class="addr">${esc(pc.host)}:${esc(pc.port)}${pc.saved ? ' · vinculado' : ' · requiere PIN'}</div>
      </div>
      ${pc.saved ? '<button class="x" data-forget="1" aria-label="Olvidar">✕</button>' : ''}
    </div>`).join('') + (scanning ? '<div class="empty"><span class="spin"></span>Buscando…</div>' : '');
}

$('#list').addEventListener('click', (e) => {
  const card = e.target.closest('.pc');
  if (!card) return;
  if (e.target.closest('[data-forget]')) {
    if (confirm('¿Olvidar este PC? Tendrás que ingresar el PIN de nuevo.')) { N.forget(card.dataset.id); loadSaved(); render(); }
    return;
  }
  N.vibrate(10);
  if (card.dataset.saved === '1') N.open(card.dataset.id);
  else N.openAddress(card.dataset.host, parseInt(card.dataset.port, 10) || 8765);
});

function scan() {
  if (scanning) return;
  scanning = true; render();
  N.discover();
}
window.onDiscovered = (list) => {
  scanning = false;
  found = list || [];
  loadSaved();
  render();
  const auto = N.autoOpen();
  if (auto && !message && saved.last && found.some((f) => f.id === saved.last) && saved.pcs[saved.last]) {
    N.open(saved.last);
  }
};

$('#scan').addEventListener('click', scan);
$('#go').addEventListener('click', () => {
  const ip = $('#ip').value.trim();
  const port = parseInt($('#port').value, 10) || 8765;
  if (!/^[\w.\-:]+$/.test(ip)) { $('#ip').focus(); return; }
  N.openAddress(ip, port);
});

if (!N) {
  document.body.innerHTML = '<p class="empty">Esta página es parte de la app Android.</p>';
} else {
  loadSaved();
  render();
  scan();
}
</script>
</body>
</html>
